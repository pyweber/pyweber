[app]
name = 'Pyweber App'
version = '0.1.0'
description = 'A powerfull app made with pyweber framework'
keywords = ['pyweber', 'python web', 'web', 'python']
icon = '/_pyweber/static/favicon.ico'

[requirements]
packages = []

[server]
host = '0.0.0.0'
port = 8800
route = '/'
https_enabled = false
cert_file = ''
key_file = ''

[database]
# Prefer a full async SQLAlchemy URL. Env PYWEBER_DATABASE_URL wins.
url = 'sqlite+aiosqlite:///:memory:'
echo = false
pool_size = 5
auto_commit = false

# Legacy nested form still supported by pyweber.db.config.build_url_from_parts:
# [database.database_1]
# type = 'sqlite'
# name = './app.db'

[session]
secret_key = 'TOKEN_HEX'
timeout = 3600
reload_mode = false
env = 'development'
backend = 'memory'
# redis_url = 'redis://localhost:6379/0'
# key_prefix = 'pyweber:session:'

[security]
allowed_origins = []
# Hosts for Window.open / to_url / launch_url absolute URLs (relative /paths always OK).
# Also inherits hostnames from allowed_origins. Env: PYWEBER_ALLOWED_REDIRECT_HOSTS
allowed_redirect_hosts = []
max_body_size = 10485760
csrf_enabled = true
rate_limit_enabled = false
rate_limit_rpm = 120
gzip_enabled = true
gzip_min_bytes = 500
# validate_uploads = false  # set true / PYWEBER_VALIDATE_UPLOADS=1 to sniff MIME
# csp = 'off'  # or a full Content-Security-Policy string; env PYWEBER_CSP wins

[api_keys]