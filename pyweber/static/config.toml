[app]
name = 'Pyweber App'
version = '0.1.0'
description = 'A powerfull app made with pyweber framework'
keywords = ['pyweber', 'python web', 'web', 'python']
icon = '/_pyweber/static/favicon.ico'

[requirements]
packages = []

[server]
host = '0.0.0.0'
port = 8800
route = '/'
https_enabled = false
cert_file = ''
key_file = ''

[database.database_1]
type = ''
name = ''
username = ''
password = ''
host = ''
port = ''
dsn = ''
ssl = ''

[session]
secret_key = 'TOKEN_HEX'
timeout = 3600
reload_mode = false
env = 'development'

[security]
allowed_origins = []
max_body_size = 10485760
csrf_enabled = true
rate_limit_enabled = false
rate_limit_rpm = 120
gzip_enabled = true
gzip_min_bytes = 500
# csp = 'off'  # or a full Content-Security-Policy string; env PYWEBER_CSP wins

[api_keys]