[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyweber"
version = "1.6.1"
description = "A lightweight Python framework for building and managing web applications."
readme = "README.md"
authors = [{ name = "Pyweber Limitada", email = "pypi.dev@gmail.com" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["watchdog", "toml", "questionary", "qrcode[pil]"]
[project.urls]
Documentation = "https://pyweber.dev/"
Source = "https://github.com/pyweber/pyweber"
Tracker = "https://github.com/pyweber/pyweber/issues"
PyPI = "https://pypi.org/project/pyweber/"
YouTube = "https://youtube.com/@devpythonMZ"
Examples = "https://github.com/pyweber-examples"
# Supported versions / security policy (≤1.3.1 not recommended; yank on PyPI — not via this file)
Security = "https://pyweber.dev/guides/supported-versions/"

[project.scripts]
pyweber = "pyweber.cli.commands:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyweber*"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio"]
fast-html = ["lxml"]
db = ["sqlalchemy[asyncio]>=2.0", "alembic>=1.13"]
db-sqlite = ["aiosqlite>=0.20"]
db-pg = ["asyncpg>=0.29"]
db-mysql = ["aiomysql>=0.2"]
db-mssql = ["aioodbc>=0.5"]
redis = ["redis[hiredis]>=8.1.0"]

[tool.setuptools.package-data]
pyweber = ["static/**/*", "admin/**/*"]

[tool.coverage.run]
omit = ["pyweber/cli/commands.py"]

[tool.coverage.report]
fail_under = 88
show_missing = true
